name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: v0.0.0
        required: false
        type: string
  release:
    types: [released]
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build ${{ matrix.distribution }}
    strategy:
      fail-fast: false
      matrix:
        distribution: [direct, play]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HONGSI_API_URL: ${{ vars.HONGSI_API_URL || 'https://hongsi.kyuyoung.dev' }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
      HONGSI_ANDROID_DISTRIBUTION: ${{ matrix.distribution }}
      BUILD_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - name: SDK and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64-${{ matrix.distribution }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Set release version
        if: env.BUILD_VERSION != ''
        run: node scripts/set-release-version.mjs "$BUILD_VERSION"
      - name: Restore Firebase and signing files
        env:
          FIREBASE_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: node scripts/prepare-android-build.mjs
      - name: Signed APK for direct download
        if: env.HAS_SIGNING == 'true' && matrix.distribution == 'direct'
        run: pnpm tauri android build --target aarch64 --apk --ci
      - name: Signed AAB for Google Play
        if: env.HAS_SIGNING == 'true' && matrix.distribution == 'play'
        run: pnpm tauri android build --target aarch64 --aab --ci
      - name: Debug APK for testing
        if: env.HAS_SIGNING != 'true' && matrix.distribution == 'direct'
        run: pnpm tauri android build --target aarch64 --debug --apk --ci
      - name: Verify and package GitHub update
        if: env.HAS_SIGNING == 'true' && matrix.distribution == 'direct'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          CODE=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          node scripts/package-android-release.mjs "$APK" "$CODE" "$RUNNER_TEMP/hongsi-release"
      - name: Verify and package Play bundle
        if: env.HAS_SIGNING == 'true' && matrix.distribution == 'play'
        run: |
          AAB=src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          jarsigner -verify "$AAB"
          python3 - "$AAB" <<'PYTHON'
          import struct, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              names = bundle.namelist()
              assert any(n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC')) for n in names), 'Unsigned bundle'
              manifest = bundle.read('base/manifest/AndroidManifest.xml')
              assert b'REQUEST_INSTALL_PACKAGES' not in manifest, 'Play bundle contains APK install permission'
              assert b'UpdateInstallReceiver' not in manifest, 'Play bundle contains APK installer'
              libraries = [n for n in names if n.startswith('base/lib/') and n.endswith('.so')]
              assert libraries and any('/arm64-v8a/' in n for n in libraries), 'Missing 64-bit native libraries'
              for name in libraries:
                  elf = bundle.read(name)
                  assert elf[:4] == b'\x7fELF' and elf[4] in (1, 2) and elf[5] in (1, 2), name
                  endian = '<' if elf[5] == 1 else '>'
                  wide = elf[4] == 2
                  offset = struct.unpack_from(endian + ('Q' if wide else 'I'), elf, 32 if wide else 28)[0]
                  stride, count = struct.unpack_from(endian + 'HH', elf, 54 if wide else 42)
                  loads = 0
                  for i in range(count):
                      pos = offset + i * stride
                      if struct.unpack_from(endian + 'I', elf, pos)[0] != 1:
                          continue
                      loads += 1
                      align = struct.unpack_from(endian + ('Q' if wide else 'I'), elf, pos + (48 if wide else 28))[0]
                      assert align >= 16384, f'{name}: PT_LOAD alignment {align} is below 16 KB'
                  assert loads, f'{name}: no PT_LOAD headers'
              print(f'Play bundle verified: no APK installer permission; {len(libraries)} aligned native libraries')
          PYTHON
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p "$RUNNER_TEMP/hongsi-release/android"
          cp "$AAB" "$RUNNER_TEMP/hongsi-release/android/hongsi-$VERSION.aab"
      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING == 'true'
        with:
          name: ${{ matrix.distribution == 'direct' && 'hongsi-android' || 'hongsi-google-play' }}
          path: ${{ runner.temp }}/hongsi-release/android/
          if-no-files-found: error
      - name: Remove restored credentials
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties src-tauri/gen/android/app/google-services.json "$RUNNER_TEMP/hongsi-release.jks"

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: hongsi-android
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: hongsi-google-play
          path: release-assets
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node app/scripts/publish-github-release.mjs release-assets
